<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Fórmula 1</title>
</head>

<body>

    <header>
        <h1>Contato</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Fale conosco</h2>

            <p>
                Tem alguma curiosidade sobre Fórmula 1 ou quer compartilhar
                sua opinião sobre pilotos, equipes e corridas?
                Envie uma mensagem!
            </p>

            <form>

                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" required>
                </p>

                <p>
                    <label for="categoria">Categoria:</label><br>

                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="pilotos">Pilotos</option>
                        <option value="equipes">Equipes</option>
                        <option value="corridas">Corridas</option>
                        <option value="temporada">Temporada atual</option>
                        <option value="historia">História da Fórmula 1</option>
                        <option value="outros">Outros</option>
                    </select>
                </p>

                <p>
                    <label for="comentario">Comentário:</label><br>

                    <textarea id="comentario" name="comentario" rows="6" cols="40" required>
                    </textarea>
                </p>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Mini Site Fórmula 1 - Atividade de HTML</p>
    </footer>

</body>

</html>
